# DAYBOOK Worker. Deploy: see README "Teacher deploy steps".
name = "daybook-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# The Cloudflare Pages origin of the static site (no trailing slash). CORS allows only this origin.
ALLOWED_ORIGIN = "https://daybook.pages.dev"
# Photo store: "kv" (default, free, no payment method) or "r2" (needs the [[r2_buckets]] block below).
PHOTO_STORE = "kv"
# Retention: photos expire after 7 days (KV expirationTtl; for R2 use the lifecycle rule in the README).
PHOTO_TTL_DAYS = "7"
# Submission records (token, day, ts; no photo) live 14 days so a weekly `daybook pull` never misses one.
RECORD_TTL_DAYS = "14"
RATE_PER_HOUR = "10"

# Secret (not in this file): npx wrangler secret put TEACHER_TOKEN

# Records (submissions, check-ins, sessions, token map, moments, reactions, rate counters): D1, Cloudflare's SQLite.
# Create once: npx wrangler d1 create daybook   -> paste the printed database_id below. The Worker creates its tables.
[[d1_databases]]
binding = "DB"
database_name = "daybook"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Daily cleanup at 04:17 KST: records older than RECORD_TTL_DAYS, rate counters older than 2 days.
[triggers]
crons = ["17 19 * * *"]

# AMP Live (F7): one Durable Object per room, SQLite storage backend (the only kind on the free plan).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

# Photos and moment images only (KV with TTLs); no KV list is ever used.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # from: npx wrangler kv namespace create SUBMISSIONS

# Optional R2 photo store (requires a payment method on the Cloudflare account):
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "daybook-photos"

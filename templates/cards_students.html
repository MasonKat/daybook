<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>{{ S.card_title }} · {{ cls.name }}</title>
<style>
@page { size: A4; margin: 10mm; }
body { font: 10pt/1.45 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; color: #111; margin: 0; }
.sheet { color: #6b7280; font-size: 8.5pt; margin: 0 0 3mm; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.card { border: 1px dashed #9ca3af; padding: 4.5mm 6mm; height: 68mm; box-sizing: border-box; break-inside: avoid; page-break-inside: avoid;
  display: flex; flex-direction: column; gap: 1.6mm; }
.card h2 { margin: 0; font-size: 13pt; } .card h2 small { font-size: 9pt; color: #6b7280; font-weight: 500; margin-left: 2mm; }
.link { background: #eff6ff; color: #1e3a8a; border-radius: 2mm; padding: 1.2mm 2mm; font-weight: 600; }
.home { font-size: 8pt; line-height: 1.35; color: #374151; margin: 0; }
.ritual { display: flex; gap: 2mm; align-items: center; margin: .5mm 0; }
.step { flex: 1; text-align: center; font-size: 8.5pt; } .step svg { width: 13mm; height: 11mm; display: block; margin: 0 auto 0.6mm; }
.arrow { color: #9ca3af; }
.rule { font-size: 8.5pt; color: #b45309; font-weight: 600; margin-top: auto; padding-top: 1mm; }
@media screen { body { max-width: 200mm; margin: 8mm auto; } }
</style>
</head>
<body>
<p class="sheet">{{ S.card_sheet | fmt(cls=cls.name) }}</p>
<div class="grid">
{% for s in students %}
<div class="card">
  <h2>{{ s.display_name }}<small>{{ S.card_title }}</small></h2>
  <div class="link">{{ S.card_link }}</div>
  <p class="home">{{ S.card_home }}<br>{{ S.a2hs_ios }}<br>{{ S.a2hs_android }}</p>
  <div class="ritual" aria-label="{{ S.card_ritual }}">
    <div class="step"><svg viewBox="0 0 52 44" aria-hidden="true"><rect x="8" y="2" width="36" height="40" rx="5" fill="none" stroke="#2563eb" stroke-width="2.5"/>{% for y in (12, 22, 32) %}{% for x in (17, 26, 35) %}<circle cx="{{ x }}" cy="{{ y }}" r="3" fill="#2563eb"/>{% endfor %}{% endfor %}</svg>① {{ S.card_r1 }}</div>
    <span class="arrow">→</span>
    <div class="step"><svg viewBox="0 0 52 44" aria-hidden="true"><rect x="4" y="6" width="44" height="32" rx="4" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M8 34 L20 20 L29 29 L35 23 L44 34 Z" fill="#7c3aed" opacity=".5"/><circle cx="36" cy="14" r="4" fill="#7c3aed"/></svg>② {{ S.card_r2 }}</div>
    <span class="arrow">→</span>
    <div class="step"><svg viewBox="0 0 52 44" aria-hidden="true"><rect x="4" y="10" width="44" height="30" rx="5" fill="none" stroke="#14b8a6" stroke-width="2.5"/><rect x="17" y="5" width="18" height="7" rx="2" fill="#14b8a6"/><path d="M17 25 L24 32 L36 19" fill="none" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>③ {{ S.card_r3 }}</div>
  </div>
  <div class="rule">{{ S.card_rule }}</div>
</div>
{% endfor %}
</div>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daybook"
version = "0.1.0"
description = "Single-teacher student ledger and static parent report generator"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "jinja2>=3.1", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
daybook = "console.cli:main"

[tool.setuptools]
packages = ["console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
